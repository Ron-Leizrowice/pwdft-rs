# Converged SCF for Si — higher cutoff and denser k-grid

system:
  lattice:
    - [0.0, 2.7155, 2.7155]
    - [2.7155, 0.0, 2.7155]
    - [2.7155, 2.7155, 0.0]
  atoms:
    - { symbol: Si, position: [0.0, 0.0, 0.0] }
    - { symbol: Si, position: [0.25, 0.25, 0.25] }

basis:
  ecutwfc: 200.0

kpoints:
  type: monkhorst_pack
  grid: [4, 4, 4]

scf:
  max_iter: 60
  conv_threshold: 1.0e-6
  n_bands: 8
  mixing_beta: 0.3
  mixing_ndim: 8
  smearing_width: 0.05
