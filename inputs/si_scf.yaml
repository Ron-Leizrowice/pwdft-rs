# Self-consistent field calculation for bulk Si (FCC, 2 atoms)
# PseudoDojo ONCV LDA pseudopotential

system:
  lattice:
    - [0.0, 2.7155, 2.7155]
    - [2.7155, 0.0, 2.7155]
    - [2.7155, 2.7155, 0.0]
  atoms:
    - { symbol: Si, position: [0.0, 0.0, 0.0] }
    - { symbol: Si, position: [0.25, 0.25, 0.25] }

basis:
  ecutwfc: 100.0

kpoints:
  type: monkhorst_pack
  grid: [2, 2, 2]

scf:
  max_iter: 50
  conv_threshold: 1.0e-5
  n_bands: 8
  mixing_beta: 0.3
  mixing_ndim: 8
  smearing_width: 0.1
  # mixing_mode options: plain | kerker | broyden | broyden_kerker |
  #                      periodic_pulay | periodic_pulay_kerker
  # Periodic Pulay (Banerjee et al. JCTC 12, 3053 (2016)) runs plain linear
  # mixing except every `pulay_period`-th iteration, which does a DIIS step:
  # mixing_mode: periodic_pulay
  # pulay_period: 3

# Optional: initial-density (SAD) knobs (CFGN Phase 1). The Gaussian
# model-charge width (Å) controls the starting guess when a pseudopotential
# lacks PP_RHOATOM. The SCF refines the initial guess away in the first few
# iterations, so the default of 1.0 Å is fine for virtually all inputs.
# Uncomment to override for sensitivity studies.
# initial_density:
#   gaussian_sigma: 1.0
