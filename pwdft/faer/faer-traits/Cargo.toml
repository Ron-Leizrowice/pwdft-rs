[package]
name = "faer-traits"
version = "0.24.0"
edition = "2021"
authors = ["sarah quiñones <sarah@veganb.tw>"]
description = "linear algebra library"
readme = "../README.md"
repository = "https://codeberg.org/sarah-quinones/faer"
license = "MIT"
keywords = ["math", "linear-algebra"]

[dependencies]
bytemuck = "1.24.0"
reborrow = "0.5.5"
generativity = "1.1.0"
libm = { version = "0.2.15", default-features = false }

dyn-stack = { version = "0.13.2", default-features = false, features = ["core-error", "alloc"] }
pulp = { version = "0.22.2", default-features = false }

num-complex = { version = "0.4.6", default-features = false }
num-traits = { version = "0.2.19", default-features = false }
qd = { version = "0.8.0", default-features = false }

[features]
default = [
  "std"
]
std = [
  "pulp/std",
  "qd/std",
  "num-traits/std",
  "num-complex/std",
  "libm/arch",
]

# Vendored upstream code. Opt out of pwdft-rs's lint policy — we track faer
# for local patches (MAX_REORTH fix, see docs/FAER_ITERATE_LANCZOS_FIX.md),
# not to gate on its internal style. Without this, workspace-member status
# exposes faer to our CI's `-D warnings`, which would block every PR.
[lints.rust]
warnings = "allow"

[lints.clippy]
all = { level = "allow", priority = -1 }
