[package]
name = "pwdft-core"
version = "0.1.0"
edition = "2024"

[lib]
# Library target is the default (src/lib.rs). Naming it "pwdft" would
# collide with the binary target below, so the lib keeps the crate name
# (pwdft-core) and the CLI is `pwdft`.

[[bin]]
name = "pwdft"
path = "src/main.rs"

[features]
default = []
gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]

[dependencies]
approx = ">=0.5"
nalgebra = { version = ">=0.34", features = ["serde-serialize"] }
faer = { workspace = true }
dyn-stack = ">=0.13"
ndarray = ">=0.16"
ndrustfft = ">=0.5"
mendeleev = { version = ">=0.8", default-features = false, features = ["atomic_number", "symbol", "element_list"] }
num-complex = ">=0.4"
puruspe = ">=0.4"
rayon = ">=1.11"
serde = { version = ">=1", features = ["derive"] }
serde_yaml_ng = ">=0.10"
thiserror = ">=2"
clap = { version = ">=4", features = ["derive"] }
log = ">=0.4"
env_logger = ">=0.11"
indicatif = ">=0.17"
wgpu = { version = ">=24.0", optional = true }
pollster = { version = ">=0.4", optional = true }
bytemuck = { version = ">=1.14", features = ["derive"], optional = true }

[lints]
workspace = true
