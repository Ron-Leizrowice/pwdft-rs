name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref (PR branch or main) so queue
# depth stays low when force-pushes land in bursts.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (clippy + test)
    runs-on: ubuntu-latest
    env:
      # Incremental artifacts are pure bloat in CI — the cache key is
      # Cargo.lock + toolchain, so a true incremental reuse never fires.
      CARGO_INCREMENTAL: "0"
      # Strip DWARF; CI checks correctness, not debuggability. Cuts
      # target/ by ~40-60% on this workspace (faer + wgpu dominate).
      RUSTFLAGS: "-C debuginfo=0"
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          # Save cache on clippy/test failure too — the next run restores
          # the partial target/ and only rebuilds the changed crate.
          cache-on-failure: true

      # Scope to our own crates. The vendored faer group
      # (faer, faer-traits, faer-macros, faer-ffi) is upstream code —
      # we track it for local patches, not to gate on its lints.
      - name: clippy (default features)
        run: cargo clippy -p pwdft-core --all-targets

      - name: clippy (gpu feature)
        run: cargo clippy -p pwdft-core --all-targets --features gpu

      - name: cargo test (tier 1)
        run: cargo test -p pwdft-core

      - name: rustdoc (warnings deny)
        run: cargo doc --no-deps -p pwdft-core
        env:
          RUSTDOCFLAGS: "-D warnings"

  validation:
    name: Python (validation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync

      - name: Ruff format check
        run: uv run ruff format --check

      - name: Ruff lint
        run: uv run ruff check

      - name: Ty (Static type checker)
        run: uv run ty check

      - name: Pytest
        run: uv run pytest
