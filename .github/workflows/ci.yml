name: CI

on:
  pull_request:

jobs:
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # Scope clippy to our own crates. The vendored faer group
      # (faer, faer-traits, faer-macros, faer-ffi) is upstream code —
      # we track it for local patches, not to gate on its lints.
      - name: clippy (default features)
        run: cargo clippy -q -p pwdft-core --all-targets

      - name: clippy (gpu feature)
        run: cargo clippy -q -p pwdft-core --all-targets --features gpu

  validation:
    name: Python (validation)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: validation
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync

      - name: Ruff format check
        run: uv run ruff format --check

      - name: Ruff lint
        run: uv run ruff check

      - name: Ty (Static type checker)
        run: uv run ty check

      - name: Pytest
        run: uv run pytest
