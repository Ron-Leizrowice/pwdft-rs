name: Rust-Checks

on:
  push:
    branches: [main]
    paths:
      - pwdft/pwdft-core/**
      - pwdft/faer/**
      - Cargo.toml
      - Cargo.lock
      - .cargo/config.toml
      - .github/workflows/rust.yml
  pull_request:
    paths:
      - pwdft/pwdft-core/**
      - pwdft/faer/**
      - Cargo.toml
      - Cargo.lock
      - .cargo/config.toml
      - .github/workflows/rust.yml
  workflow_dispatch:

# Cancel superseded runs on the same ref. Rust and Python workflows use
# distinct groups so they don't cancel each other.
concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: clippy + test
    runs-on: ubuntu-latest
    env:
      # Incremental artifacts are pure bloat in CI — the cache key is
      # Cargo.lock + toolchain, so a true incremental reuse never fires.
      CARGO_INCREMENTAL: "0"
      # Strip DWARF; CI checks correctness, not debuggability. Cuts
      # target/ by ~40-60% on this workspace (faer + wgpu dominate).
      RUSTFLAGS: "-C debuginfo=0"
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          # Save cache on clippy/test failure too — the next run restores
          # the partial target/ and only rebuilds the changed crate.
          cache-on-failure: true
          # Isolate the Tier-1 debug-profile target/ from any future
          # release-profile caches (e.g. a nightly Tier-2 workflow). Per
          # TDBG: CI Tier-1 uses --profile=dev, so the test-profile
          # artifacts differ from any release-profile ones; mixing caches
          # would thrash both.
          shared-key: pwdft-ci-tier1-dev

      # Scope to our own crates. The vendored faer group
      # (faer, faer-traits, faer-macros, faer-ffi) is upstream code —
      # we track it for local patches, not to gate on its lints.
      - name: clippy (default features)
        run: cargo clippy -p pwdft-core --all-targets

      - name: clippy (gpu feature)
        run: cargo clippy -p pwdft-core --all-targets --features gpu

      # Tier-1 is structurally compile-bound in CI, not runtime-bound:
      # every test is a unit check or a single-shot small-matrix op (no
      # SCF loops — those live in Tier-2, gated by `#[ignore]`). `O3`
      # compile cost dwarfs test wall-time on a cold runner, so we
      # override to the debug profile here. Local `cargo test` stays on
      # the O3 `[profile.test]` from Cargo.toml (see TPRF).
      #
      # Budget: post-TDBG warm-cache steady state is ~281s (measured on
      # PR #183 run 24673310982). Ceiling set to 330s — below the 343s
      # pre-TDBG baseline on main (run 24663826105) so a regression past
      # the prior profile still fails the step. Tighten once a second
      # round of measurements comes in.
      - name: cargo test (tier 1, debug build)
        run: |
          start=$(date +%s)
          cargo test --profile=dev -p pwdft-core
          elapsed=$(( $(date +%s) - start ))
          echo "Tier-1 wall-time: ${elapsed}s"
          if (( elapsed > 330 )); then
            echo "::error::Tier-1 CI wall-time regressed to ${elapsed}s (budget: 330s)"
            exit 1
          fi
