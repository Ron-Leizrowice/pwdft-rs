# Quantum ESPRESSO 7.5 reference data for pwdft-rs validation.
#
# All runs use PseudoDojo ONCV NC/LDA pseudopotentials (same as pwdft-rs),
# Fermi-Dirac smearing, Monkhorst-Pack grids, conv_thr = 1.0d-8.
# Input files in this directory, raw pw.x outputs in *.out.
#
# Units: Rydberg atomic units (QE native). Convert to eV via
#   1 Ry = 13.605_693_122_994 eV.
#
# Generated: 2026-04-17 on M3 Max, qe-7.5/build/bin/pw.x, 8 MPI ranks.

[si_diamond]
input_file        = "si_scf.in"
lattice_param_ang = 5.431
ecutwfc_ry        = 15.0
k_grid            = [4, 4, 4]
degauss_ry        = 0.01
nspin             = 1
total_energy_ry   = -17.02299344
fermi_energy_ev   = 6.3449
n_iterations      = 7
# Γ-point eigenvalues (eV). 8 lowest bands; Γ has only 8 available at ecut=15.
gamma_eigenvalues_ev = [-5.8903, 6.0816, 6.0816, 6.0816, 8.6106, 8.6106, 8.6106, 9.3253]

