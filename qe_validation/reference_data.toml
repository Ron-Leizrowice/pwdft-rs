[fe_bcc_fm]
input_file        = "fe_bcc_fm_scf.in"
lattice_param_ang = 2.87
ecutwfc_ry        = 15.0
k_grid            = [8, 8, 8]
degauss_ry        = 0.02
nspin             = 2
starting_magnetization = 0.5
total_energy_ry   = -224.91744934
fermi_energy_ev   = 26.2006
n_iterations      = 10
# NOTE: With PseudoDojo NC/LDA, Fe BCC (a=2.87 Å, ecut=15 Ry) collapses to
# non-magnetic despite starting M=0.5. Final |M| = 0.00 μB. This is a PP/cutoff
# limitation — real Fe is ferromagnetic, but this test validates nspin=2
# machinery, not magnetism physics. Compare against QE's identical (non-magnetic)
# converged energy.
total_magnetization_mub = 0.00
absolute_magnetization_mub = 0.00
# Γ eigenvalues (spin-up = spin-down to within 0.001 eV after collapse).
gamma_eigenvalues_ev = [-122.5041, -46.4140, -46.4140, -46.4140, 9.2567, 23.8230, 23.8230, 24.4515]

