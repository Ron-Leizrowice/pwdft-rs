# Si SCF matching QE parameters exactly
# ecutwfc = 15 Ry = 204.09 eV, celldm(1) = 10.2612 Bohr = 5.431 Å
[system]
lattice = [
    [0.0, 2.7155, 2.7155],
    [2.7155, 0.0, 2.7155],
    [2.7155, 2.7155, 0.0],
]
ecut = 204.09
n_bands = 8

[[system.atoms]]
symbol = "Si"
position = [0.0, 0.0, 0.0]

[[system.atoms]]
symbol = "Si"
position = [0.25, 0.25, 0.25]

[kpoints]
type = "monkhorst_pack"
grid = [4, 4, 4]

[scf]
max_iter = 60
conv_threshold = 1e-7
mixing_beta = 0.3
mixing_ndim = 8
smearing_sigma = 0.05
ecutrho_ratio = 4             # QE default for NC PPs (ecutrho = 4 * ecutwfc)
fft_grid = [20, 20, 20]      # Match QE's FFT grid exactly

[scf.pseudopotentials]
Si = "../pseudopotentials/nc/lda/Si.upf"
