# Self-consistent field calculation for bulk Si (FCC, 2 atoms)
# Uses HGH norm-conserving pseudopotential with LDA

[system]
lattice = [
    [0.0, 2.7155, 2.7155],
    [2.7155, 0.0, 2.7155],
    [2.7155, 2.7155, 0.0],
]
ecut = 100.0
n_bands = 8

[[system.atoms]]
symbol = "Si"
position = [0.0, 0.0, 0.0]

[[system.atoms]]
symbol = "Si"
position = [0.25, 0.25, 0.25]

[kpoints]
type = "monkhorst_pack"
grid = [2, 2, 2]

[scf]
max_iter = 50
conv_threshold = 1e-5
mixing_beta = 0.3
mixing_ndim = 8
smearing_sigma = 0.1
ecutrho_ratio = 4

[scf.pseudopotentials]
Si = "../pseudopotentials/nc/lda/Si.upf"
