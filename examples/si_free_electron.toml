# Free-electron band structure of Si FCC
# Lattice vectors for FCC Si (a = 5.431 Å)

[system]
lattice = [
    [0.0, 2.7155, 2.7155],
    [2.7155, 0.0, 2.7155],
    [2.7155, 2.7155, 0.0],
]
ecut = 200.0
n_bands = 10

[[system.atoms]]
symbol = "Si"
position = [0.0, 0.0, 0.0]

[[system.atoms]]
symbol = "Si"
position = [0.25, 0.25, 0.25]

# Band structure along L-Γ-X-K-Γ
[kpoints]
type = "band_path"
npoints = 50

[[kpoints.points]]
label = "L"
frac = [0.5, 0.5, 0.5]

[[kpoints.points]]
label = "Γ"
frac = [0.0, 0.0, 0.0]

[[kpoints.points]]
label = "X"
frac = [0.5, 0.0, 0.5]

[[kpoints.points]]
label = "K"
frac = [0.375, 0.375, 0.75]

[[kpoints.points]]
label = "Γ"
frac = [0.0, 0.0, 0.0]
