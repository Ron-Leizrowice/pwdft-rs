[package]
name = "pwdft-rs"
version = "0.1.0"
edition = "2024"

[features]
default = []
gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]
fftw = ["dep:fftw", "dep:fftw-sys"]

[dependencies]
approx = ">=0.5"
nalgebra = { version = ">=0.34", features = ["serde-serialize"] }
faer = ">=0.24"
ndarray = ">=0.16"
ndrustfft = ">=0.5"
num-complex = ">=0.4"
rayon = ">=1.11"
serde = { version = ">=1", features = ["derive"] }
toml = ">=0.8"
serde_yaml_ng = ">=0.10"
thiserror = ">=2"
clap = { version = ">=4", features = ["derive"] }
log = ">=0.4"
env_logger = ">=0.11"
fftw = { version = ">=0.8", default-features = false, features = ["system"], optional = true }
fftw-sys = { version = ">=0.8", default-features = false, features = ["system"], optional = true }
wgpu = { version = ">=24.0", optional = true }
pollster = { version = ">=0.4", optional = true }
bytemuck = { version = ">=1.14", features = ["derive"], optional = true }

[dev-dependencies]
criterion = { version = ">=0.5", features = ["html_reports"] }

[[bench]]
name = "scf_benchmarks"
harness = false

[[bench]]
name = "gpu_benchmarks"
harness = false
required-features = ["gpu"]

[profile.release]
opt-level = 3
lto = "thin"

# Optimize faer in test/debug builds — its SIMD codegen is 230× slower
# without optimizations, making eigensolve-heavy tests impractical.
[profile.dev.package.faer]
opt-level = 3
[profile.dev.package.faer-traits]
opt-level = 3
[profile.dev.package.gemm]
opt-level = 3
[profile.dev.package.gemm-common]
opt-level = 3
[profile.dev.package.pulp]
opt-level = 3
