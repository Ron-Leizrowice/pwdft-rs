[package]
name = "pwdft-rs"
version = "0.1.0"
edition = "2024"

[features]
default = []
gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]

[dependencies]
approx = ">=0.5"
nalgebra = { version = ">=0.34", features = ["serde-serialize"] }
nalgebra-lapack = { version = ">=0.27", default-features = false, features = ["lapack-accelerate"] }
lapack = { version = ">=0.20", default-features = false }
num-complex = ">=0.4"
rustfft = ">=6.2"
rayon = ">=1.11"
serde = { version = ">=1", features = ["derive"] }
toml = ">=0.8"
serde_yaml_ng = ">=0.10"
thiserror = ">=2"
clap = { version = ">=4", features = ["derive"] }
log = ">=0.4"
env_logger = ">=0.11"
wgpu = { version = ">=24.0", optional = true }
pollster = { version = ">=0.4", optional = true }
bytemuck = { version = ">=1.14", features = ["derive"], optional = true }

[dev-dependencies]
criterion = { version = ">=0.5", features = ["html_reports"] }

[[bench]]
name = "scf_benchmarks"
harness = false

[[bench]]
name = "gpu_benchmarks"
harness = false
required-features = ["gpu"]

[profile.release]
opt-level = 3
lto = "thin"
