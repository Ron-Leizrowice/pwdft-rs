[package]
name = "pwdft-rs"
version = "0.1.0"
edition = "2024"

[features]
default = []
gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]

[dependencies]
approx = ">=0.5"
nalgebra = { version = ">=0.34", features = ["serde-serialize"] }
faer = ">=0.24"
dyn-stack = ">=0.13"
ndarray = ">=0.16"
ndrustfft = ">=0.5"
mendeleev = { version = ">=0.8", default-features = false, features = ["atomic_number", "symbol", "element_list"] }
num-complex = ">=0.4"
puruspe = ">=0.4"
rayon = ">=1.11"
serde = { version = ">=1", features = ["derive"] }
serde_yaml_ng = ">=0.10"
thiserror = ">=2"
clap = { version = ">=4", features = ["derive"] }
log = ">=0.4"
env_logger = ">=0.11"
indicatif = ">=0.17"
wgpu = { version = ">=24.0", optional = true }
pollster = { version = ">=0.4", optional = true }
bytemuck = { version = ">=1.14", features = ["derive"], optional = true }

[dev-dependencies]
criterion = { version = ">=0.5", features = ["html_reports"] }

[[bench]]
name = "scf_benchmarks"
harness = false

[[bench]]
name = "gpu_benchmarks"
harness = false
required-features = ["gpu"]

[lints.clippy]
# Bug prevention
float_cmp = "warn"
# Performance
needless_pass_by_value = "warn"
cloned_instead_of_copied = "warn"
# Code modernization
uninlined_format_args = "warn"
redundant_closure = "warn"
unreadable_literal = "warn"
manual_let_else = "warn"

# --- QLNT additions (Tier-1 quality lints) ---
doc_link_with_quotes = "warn"
explicit_iter_loop = "warn"
implicit_clone = "warn"
inefficient_to_string = "warn"
items_after_statements = "warn"
manual_div_ceil = "warn"
manual_midpoint = "warn"
match_same_arms = "warn"
redundant_clone = "warn"
semicolon_if_nothing_returned = "warn"
unnecessary_box_returns = "warn"
unnecessary_wraps = "warn"

# --- CAST audit: numeric cast correctness lints ---
# Every `as` cast that hits one of these must either be rewritten with
# `try_from` / `u64::from` / explicit saturation, or carry
# `#[allow(clippy::cast_..., reason = "...")]` documenting the invariant.
# Module-level allows preferred over file-level so future casts still get flagged.
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"

[profile.release]
opt-level = 3
lto = "thin"

# Optimize faer in test/debug builds — its SIMD codegen is 230× slower
# without optimizations, making eigensolve-heavy tests impractical.
[profile.dev.package.faer]
opt-level = 3
[profile.dev.package.faer-traits]
opt-level = 3
[profile.dev.package.gemm]
opt-level = 3
[profile.dev.package.gemm-common]
opt-level = 3
[profile.dev.package.pulp]
opt-level = 3
