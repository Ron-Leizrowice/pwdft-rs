[workspace]
resolver = "3"

members = [
    "pwdft/pwdft-core",
    "pwdft/faer/faer",
    "pwdft/faer/faer-traits",
    "pwdft/faer/faer-macros",
    "pwdft/faer/faer-ffi",
]
exclude = [
    "pwdft/faer/faer-no-std-test",
    "pwdft/faer/eigen-bench-setup",
]

[workspace.dependencies]
# Local path overrides for the vendored faer library
faer = { path = "pwdft/faer/faer" }
faer-traits = { path = "pwdft/faer/faer-traits" }

[workspace.lints.clippy]
# --- Performance ---
needless_pass_by_value = "warn"   # Avoids moving large types (like big structs) into functions
cloned_instead_of_copied = "warn" # Encourages Copy for small types (f64, i32) instead of Clone
inefficient_to_string = "warn"    # Prevents unnecessary heap allocations for string conversions

# --- Numerical Correctness ---
float_cmp = "warn"                # Error-prone: directly comparing floats (use epsilon checks)
cast_possible_truncation = "warn" # Critical: caught when f64 -> f32 or i64 -> i32
cast_possible_wrap = "warn"       # Alerts when casting might overflow (i32 -> i16)
cast_sign_loss = "warn"           # Alerts when u32 -> i32 might lose the sign
cast_lossless = "warn"            # Suggests using .into() for safe upward casts

# --- Safety & Documentation ---
unwrap_used = "warn"              # Discourages panics; use .expect() or Result handling
panic = "warn"                    # Highlights explicit panic calls
missing_errors_doc = "warn"       # Requires documentation for functions returning Result
missing_panics_doc = "warn"       # Requires documentation if a function can panic

# --- Code Quality ---
unreadable_literal = "warn"       # Forces underscores in numbers: 1_000_000.0 instead of 1000000.0
uninlined_format_args = "warn"    # Modern style: format!("{var}") instead of format!("{}", var)
redundant_closure = "warn"        # Simplifies .map(|x| foo(x)) to .map(foo)
manual_let_else = "warn"          # Encourages cleaner guard patterns
match_same_arms = "warn"          # Catches logic duplication in match statements
items_after_statements = "warn"   # Keeps code layout clean (functions/structs before logic)

[profile.release]
opt-level = 3
lto = "thin"                      # High performance with reasonable link times on macOS

[profile.dev.package."*"]
# Dependencies are always fast, even in debug mode.
# Keeps FFTs and Linear Algebra usable during testing.
opt-level = 3

[profile.test]
# Ensures the physics logic is tested at full speed.
opt-level = 3

[profile.test.package."*"]
opt-level = 3
