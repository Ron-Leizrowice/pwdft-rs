[workspace]
resolver = "3"
members = [
    "pwdft/pwdft-core",
    "pwdft/faer/faer",
    "pwdft/faer/faer-traits",
    "pwdft/faer/faer-macros",
    "pwdft/faer/faer-ffi",
]
exclude = [
    "pwdft/faer/faer-no-std-test",
    "pwdft/faer/eigen-bench-setup",
]

[workspace.dependencies]
faer = { path = "pwdft/faer/faer" }
faer-traits = { path = "pwdft/faer/faer-traits" }

[workspace.lints.clippy]
# Performance
needless_pass_by_value = "warn"
cloned_instead_of_copied = "warn"
# --- Code Quality  ---
uninlined_format_args = "warn"
redundant_closure = "warn"
unreadable_literal = "warn"
manual_let_else = "warn"
doc_link_with_quotes = "warn"
explicit_iter_loop = "warn"
implicit_clone = "warn"
inefficient_to_string = "warn"
items_after_statements = "warn"
manual_div_ceil = "warn"
manual_midpoint = "warn"
match_same_arms = "warn"
redundant_clone = "warn"
semicolon_if_nothing_returned = "warn"
unnecessary_box_returns = "warn"
unnecessary_wraps = "warn"
# --- Numerical correctness ---
float_cmp = "warn"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"
cast_lossless = "warn"
# --- panic-family enforcement in production code ---
unwrap_used = "warn"
panic = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"

[profile.release]
opt-level = 3
lto = "thin"
# Fat LTO evaluation is tracked in proposals/LTOB-fat-lto-benchmark.md.

# All dependencies compile at O3 in dev builds. The local crates
# stay at the dev default opt-level=0 for fast incremental rebuilds.
[profile.dev.package."*"]
opt-level = 3

# local crates are compiled at O3 under the test profile.
[profile.test]
opt-level = 3

[profile.test.package."*"]
opt-level = 3
