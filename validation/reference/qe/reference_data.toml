nspin             = 1
total_energy_ry   = -23.84343910
one_electron_ry   = 8.50287341
fermi_energy_ev   = 15.8873
n_iterations      = 9
gamma_eigenvalues_ev = [-8.1456, 14.0232, 14.0232, 14.0232, 19.3568, 19.3568, 19.3568, 27.2505]

[al_fcc]
input_file        = "al_fcc_scf.in"
lattice_param_ang = 4.05
# Regenerated 2026-04-19 (VQEF-AL) at basis-converged ecut=24 Ry
# (PseudoDojo `.standard` for Al). Old ref was ecut=15 Ry with
# total_energy_ry = -4.72371790; QE itself was under-converged at ecut=15
# (48 meV of basis truncation from ecut=15 → 24).
ecutwfc_ry        = 24.0
k_grid            = [8, 8, 8]
degauss_ry        = 0.02
nspin             = 1
total_energy_ry   = -4.72724484
one_electron_ry   = 2.88539588
fermi_energy_ev   = 7.5876
n_iterations      = 6
# Al FCC: 3 valence electrons → 6 bands at Γ. 229 PWs at Γ (ecut=24).
gamma_eigenvalues_ev = [-3.4118, 20.2167, 20.2167, 21.5192, 21.5192, 21.5192]

[fe_bcc_fm]
input_file        = "fe_bcc_fm_scf.in"
lattice_param_ang = 2.87
ecutwfc_ry        = 15.0
k_grid            = [8, 8, 8]
degauss_ry        = 0.02
nspin             = 2
starting_magnetization = 0.5
total_energy_ry   = -224.91744934
one_electron_ry   = -50.85651213
fermi_energy_ev   = 26.2006
n_iterations      = 10
# NOTE: With PseudoDojo NC/LDA, Fe BCC (a=2.87 Å, ecut=15 Ry) collapses to
# non-magnetic despite starting M=0.5. Final |M| = 0.00 μB. This is a PP/cutoff
# limitation — real Fe is ferromagnetic, but this test validates nspin=2
# machinery, not magnetism physics. Compare against QE's identical (non-magnetic)
# converged energy.
total_magnetization_mub = 0.00
absolute_magnetization_mub = 0.00
# Γ eigenvalues (spin-up = spin-down to within 0.001 eV after collapse).
gamma_eigenvalues_ev = [-122.5041, -46.4140, -46.4140, -46.4140, 9.2567, 23.8230, 23.8230, 24.4515]

