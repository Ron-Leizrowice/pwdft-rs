# Quantum ESPRESSO 7.5 reference data for pwdft-rs validation.
#
# All runs use PseudoDojo ONCV NC/LDA pseudopotentials (same as pwdft-rs),
# Fermi-Dirac smearing, Monkhorst-Pack grids, conv_thr = 1.0d-8.
# Input files in this directory, raw pw.x outputs in *.out.
#
# Units: Rydberg atomic units (QE native). Convert to eV via
#   1 Ry = 13.605_693_122_994 eV.
#
# `one_electron_ry` is QE's `one-electron contribution` line
# (`eband + deband = <ψ|T + V_ion|ψ>`, PW/src/electrons.f90:1719).
# Consumed by the BSUM one-electron-sum identity gate in
# `tests/qe_validation.rs::assert_one_electron_sum_matches_qe`, which compares
# it against pwdft-rs's `e_kinetic + e_local + e_local_g0_shift +
# e_nonlocal`. The deband piece cancels the V_H + V_xc double-counting
# carried in raw eigenvalues, so the BSUM residual is invariant to the
# V_loc(G=0) convention (unlike the literal Σ w_k f_{ik} ε_{ik} band
# sum) and is a sharper density-drift indicator than E_total alone.
#
# Generated: 2026-04-17 on M3 Max, qe-7.5/build/bin/pw.x, 8 MPI ranks.
# `one_electron_ry` values added 2026-04-19 under BSUM (harvested from
# the existing *.out files; no QE re-runs required).

[si_diamond]
input_file        = "si_scf.in"
lattice_param_ang = 5.431
ecutwfc_ry        = 15.0
k_grid            = [4, 4, 4]
degauss_ry        = 0.01
nspin             = 1
total_energy_ry   = -17.02299344
one_electron_ry   = 4.86744632
fermi_energy_ev   = 6.3449
n_iterations      = 7
# Γ-point eigenvalues (eV). 8 lowest bands; Γ has only 8 available at ecut=15.
gamma_eigenvalues_ev = [-5.8903, 6.0816, 6.0816, 6.0816, 8.6106, 8.6106, 8.6106, 9.3253]

[c_diamond]
input_file        = "c_diamond_scf.in"
